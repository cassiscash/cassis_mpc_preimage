[package]
name = "mpc_preimage"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
futures = "0.3.34"
mpz-circuits = { git = "https://github.com/privacy-scaling-explorations/mpz", rev = "6a1864d0b4425bfc81abdec42ec4b3f5a3ffced2", version = "0.1.0-beta.1" }
mpz-common = { git = "https://github.com/privacy-scaling-explorations/mpz", rev = "6a1864d0b4425bfc81abdec42ec4b3f5a3ffced2", version = "0.1.0-beta.1" }
mpz-core = { git = "https://github.com/privacy-scaling-explorations/mpz", rev = "6a1864d0b4425bfc81abdec42ec4b3f5a3ffced2", version = "0.1.0-beta.1" }
mpz-garble-core = { git = "https://github.com/privacy-scaling-explorations/mpz", rev = "6a1864d0b4425bfc81abdec42ec4b3f5a3ffced2", version = "0.1.0-beta.1" }
mpz-memory-core = { git = "https://github.com/privacy-scaling-explorations/mpz", rev = "6a1864d0b4425bfc81abdec42ec4b3f5a3ffced2", version = "0.1.0-beta.1" }
mpz-ot = { git = "https://github.com/privacy-scaling-explorations/mpz", rev = "6a1864d0b4425bfc81abdec42ec4b3f5a3ffced2", version = "0.1.0-beta.1" }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serio = "0.2"
sha2 = "0.10"
spake2 = "0.4"

[dev-dependencies]
iroh = "1.5.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "time"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
